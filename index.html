<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>edomax.github.io</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      text-align: center;
      padding: 3rem 4rem;
      border: 1px solid #30363d;
      border-radius: 12px;
      background: #161b22;
      max-width: 480px;
      width: 90%;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 2px solid #30363d;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #e6edf3;
      margin-bottom: 0.4rem;
    }

    .handle {
      font-size: 1rem;
      color: #8b949e;
      margin-bottom: 1.5rem;
    }

    .links {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .links a {
      display: inline-block;
      padding: 0.5rem 1.1rem;
      border-radius: 6px;
      border: 1px solid #30363d;
      color: #e6edf3;
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.15s, border-color 0.15s;
    }

    .links a:hover {
      background: #21262d;
      border-color: #8b949e;
    }
  </style>
</head>
<body>
  <div class="card">
    <img
      class="avatar"
      src="https://github.com/edomax.png"
      alt="edomax avatar"
      onerror="this.style.display='none'"
    />
    <h1>edomax</h1>
    <p class="handle">edomax.github.io</p>
    <div class="links">
      <a href="https://github.com/edomax" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>
</body>
</html>
